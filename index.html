<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#286f70" />
    <meta
      name="description"
      content="普通模式挖土引水，恐怖模式破解暗夜机关，极限恐怖躲避奶蛙、逃入下水道。"
    />
    <link rel="stylesheet" href="/boot.css" />
    <link rel="preload" as="image" href="/assets/scenes/bath-cover-v2.webp" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>奶蛙爱洗澡 · nwaxz</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen">
        <div class="boot-stage">
          <div class="boot-gallery" aria-hidden="true"><img class="boot-frame is-current" src="/assets/scenes/bath-cover-v2.webp" alt="" fetchpriority="high"/></div>
          <h1 class="boot-logo">奶蛙<span>爱洗澡</span></h1>
          <div class="boot-reel"><span id="boot-scene">泡泡浴场</span><span id="boot-slide">01 / 05</span></div>
          <nav class="boot-controls" aria-label="加载画面"><button type="button" id="boot-prev" aria-label="上一张">‹</button><button type="button" id="boot-pause" aria-label="暂停轮播" aria-pressed="false">Ⅱ</button><button type="button" id="boot-next" aria-label="下一张">›</button></nav>
          <div class="boot-loading" role="status">
            <small id="boot-label">正在准备浴室…</small
            ><progress
              id="boot-progress"
              max="100"
              aria-label="游戏加载进度"
            ></progress>
            <small id="boot-detail">初次进入会准备视频、地图和音乐</small>
          </div>
        </div>
      </div>
    </div>
    <script type="module" async src="/boot-gallery.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
